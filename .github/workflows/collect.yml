name: Collect repo stats

on:
  schedule:
    # Runs once a day. GitHub's traffic API only retains 14 days, so this
    # cadence is what keeps the compounding history store accurate.
    - cron: "17 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
          GH_OWNER: StewAlexander-com
        run: python3 scripts/collect.py

      - name: Verify history.json matches raw evidence
        run: python3 scripts/verify_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "repo-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/raw_log.jsonl
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update repo stats $(date -u +'%Y-%m-%d')"
            git push
          fi
